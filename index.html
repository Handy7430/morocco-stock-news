<!DOCTYPE html>
<html>
<head>
  <title>Atlas Markets</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #020617;
      color: white;
    }

    /* 🔥 HEADER (APP STYLE) */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(10px);
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      color: #38bdf8;
    }

    /* 🔥 MARKET TREND */
    .trend {
      text-align: center;
      font-size: 16px;
      margin: 15px;
      font-weight: bold;
    }

    /* 🔥 CONTAINER */
    .container {
      padding: 12px;
    }

    /* 🔥 CARD APP STYLE */
    .card {
      background: #0f172a;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.98);
    }

    /* 🔥 TITLE */
    a {
      color: #e2e8f0;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      display: block;
      line-height: 1.4;
    }

    /* 🔥 META */
    .meta {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
    }

    /* 🔥 SENTIMENT BADGE */
    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .positive {
      background: rgba(34,197,94,0.2);
      color: #22c55e;
    }

    .negative {
      background: rgba(255,0,0,0.2);
      color: red;
    }

    .neutral {
      background: rgba(251,191,36,0.2);
      color: #fbbf24;
    }

    /* 🔥 LOADING */
    .loading {
      text-align: center;
      margin-top: 30px;
      color: #94a3b8;
    }

  </style>
</head>

<body>

<header>
  <h1>📈 Atlas Markets</h1>
</header>

<div class="trend" id="trend">Loading...</div>

<div class="container" id="news"></div>

<script>
function loadNews() {
  fetch("/api/news?t=" + Date.now())
    .then(res => res.json())
    .then(data => {

      const container = document.getElementById("news");
      const trendDiv = document.getElementById("trend");

      if (!data || !data.news) {
        container.innerHTML = "<p class='loading'>No news available</p>";
        return;
      }

      // 🔥 trend
      trendDiv.innerHTML = data.trend;

      container.innerHTML = "";

      data.news.forEach(n => {
        const div = document.createElement("div");
        div.className = "card";

        let badgeClass = "neutral";
        if (n.sentiment === "Positive") badgeClass = "positive";
        if (n.sentiment === "Negative") badgeClass = "negative";

        div.innerHTML = `
          <a href="${n.link}" target="_blank">${n.title}</a>
          <div class="meta">${new Date(n.date).toLocaleString()}</div>
          <span class="badge ${badgeClass}">
            ${n.sentiment || "Neutral"}
          </span>
        `;

        container.appendChild(div);
      });

    })
    .catch(err => {
      console.log(err);
      document.getElementById("news").innerHTML =
        "<p class='loading'>Error loading news</p>";
    });
}

// load
loadNews();

// auto refresh
setInterval(loadNews, 60000);
</script>

</body>
</html>
