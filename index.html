<!DOCTYPE html>
<html>
<head>
  <title>Atlas Markets</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;

      background: 
        linear-gradient(rgba(2,6,23,0.85), rgba(2,6,23,0.95)),
        url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3');

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    header {
      text-align: center;
      padding: 30px;
      backdrop-filter: blur(12px);
      background: rgba(15,23,42,0.6);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header img {
      width: 100px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    header h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 28px;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 5px;
      color: #94a3b8;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }

    a {
      color: #e2e8f0;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      display: block;
    }

    a:hover {
      color: #38bdf8;
    }

    .meta {
      font-size: 13px;
      margin-top: 10px;
      color: #94a3b8;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      margin-top: 10px;
      font-weight: bold;
    }

    .high {
      background: rgba(255, 0, 0, 0.2);
      color: #ff4d4d;
    }

    .medium {
      background: rgba(255, 165, 0, 0.2);
      color: #fbbf24;
    }

    .low {
      background: rgba(0, 255, 0, 0.2);
      color: #22c55e;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <img src="logo.png" />
    <h1>📈 Atlas Markets</h1>
    <p>Live Moroccan Stock Market News</p>
  </header>

  <div class="container" id="news"></div>

  <div class="footer">
    Powered by Atlas Markets 🚀
  </div>

  <script>
    fetch("/api/news")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("news");

        data.forEach(n => {
          const div = document.createElement("div");
          div.className = "card";

          let impact = n.impact || "Low";
          let badgeClass = "low";

          if (impact === "High") badgeClass = "high";
          if (impact === "Medium") badgeClass = "medium";

          div.innerHTML = `
            <a href="${n.link}" target="_blank">${n.title}</a>
            <div class="meta">
              ${new Date(n.date).toLocaleString()} • ${n.source || "News"}
            </div>
            <span class="badge ${badgeClass}">${impact}</span>
          `;

          container.appendChild(div);
        });
      });
  </script>

</body>
</html>
