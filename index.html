<!DOCTYPE html>
<html>
<head>
  <title>Atlas Markets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #020617;
      color: white;
    }

    header {
      text-align: center;
      padding: 15px;
      background: #0f172a;
    }

    .container {
      padding: 10px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>📈 Atlas Markets</h1>
</header>

<div class="container" id="news"></div>

<script>
function loadNews() {
  fetch("/api/news?t=" + Date.now())
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("news");
      container.innerHTML = "";

      data.news.forEach(n => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <a href="${n.link}" target="_blank">${n.title}</a>
        `;

        container.appendChild(div);
      });
    });
}

loadNews();
setInterval(loadNews, 60000);
</script>

</body>
</html>
