<!DOCTYPE html>
<html>
<head>
  <title>Bourse Casablanca News</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;

      /* 🔥 Background image */
      background: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed;
background-size: cover;
    }

    /* 🔥 overlay باش تبان الكتابة */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      z-index: -1;
    }

    header {
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(10px);
      background: rgba(15, 23, 42, 0.5);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }

    a {
      color: #e2e8f0;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      display: block;
    }

    a:hover {
      color: #38bdf8;
    }

    .meta {
      font-size: 12px;
      margin-top: 8px;
      color: #cbd5f5;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      margin-top: 10px;
      font-weight: bold;
    }

    .high {
      background: rgba(255, 0, 0, 0.2);
      color: #ff4d4d;
    }

    .medium {
      background: rgba(255, 165, 0, 0.2);
      color: #fbbf24;
    }

    .low {
      background: rgba(0, 255, 0, 0.2);
      color: #22c55e;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header style="
  text-align:center;
  padding:25px;
  backdrop-filter: blur(12px);
  background: rgba(15,23,42,0.6);
  border-bottom:1px solid rgba(255,255,255,0.1);
">

  <img src="logo.png" style="width:80px; margin-bottom:10px;" />

  <h1 style="margin:0;color:#38bdf8;">Atlas Markets</h1>

  <p style="margin:5px 0 0;color:#94a3b8;font-size:13px;">
    Live Moroccan Stock Market News
  </p>

</header>

  <div class="container" id="news"></div>

  <div class="footer">
    Powered by Morocco Stock AI 🚀
  </div>

  <script>
    fetch("/api/news")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("news");

        data.forEach(n => {
          const div = document.createElement("div");
          div.className = "card";

          let badgeClass = "low";
          if (n.impact === "High") badgeClass = "high";
          if (n.impact === "Medium") badgeClass = "medium";

          div.innerHTML = `
            <a href="${n.link}" target="_blank">${n.title}</a>
            <div class="meta">${new Date(n.date).toLocaleString()}</div>
            <span class="badge ${badgeClass}">${n.impact}</span>
          `;

          container.appendChild(div);
        });
      });
  </script>

</body>
</html>
