<!DOCTYPE html>
<html>
<head>
  <title>Atlas Markets</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      color: white;
      background: linear-gradient(rgba(2,6,23,0.9), rgba(2,6,23,0.95)),
      url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3');
      background-size: cover;
    }

    header {
      text-align: center;
      padding: 25px;
    }

    .trend {
      text-align: center;
      font-size: 20px;
      margin: 15px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(15,23,42,0.7);
      padding: 20px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    .meta {
      font-size: 12px;
      color: #94a3b8;
    }

    .positive { color: #22c55e; }
    .negative { color: red; }
    .neutral { color: orange; }
  </style>
</head>

<body>

<header>
  <h1>📈 Atlas Markets</h1>
</header>

<div class="trend" id="trend"></div>
<div class="container" id="news"></div>

<script>
function loadNews() {
  fetch("/api/news")
    .then(res => res.json())
    .then(data => {

      const container = document.getElementById("news");
      const trendDiv = document.getElementById("trend");

      if (!data || !data.news) {
        container.innerHTML = "<p>No news available</p>";
        return;
      }

      trendDiv.innerHTML = "Market Trend: " + data.trend;

      container.innerHTML = "";

      data.news.forEach(n => {
        const div = document.createElement("div");
        div.className = "card";

        let sentimentClass = "neutral";
        if (n.sentiment === "Positive") sentimentClass = "positive";
        if (n.sentiment === "Negative") sentimentClass = "negative";

        div.innerHTML = `
          <a href="${n.link}" target="_blank">${n.title}</a>
          <div class="meta">${new Date(n.date).toLocaleString()}</div>
          <div class="${sentimentClass}">
            ${n.sentiment}
          </div>
        `;

        container.appendChild(div);
      });

    })
    .catch(err => {
      console.log(err);
      document.getElementById("news").innerHTML = "Error loading news";
    });
}

// أول تحميل
loadNews();

// تحديث كل دقيقة
setInterval(loadNews, 60000);
</script>

</body>
</html>
